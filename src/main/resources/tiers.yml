# ==========================================================
#  DailyQuest 階級（蓋章地圖／進度路線）
#  由上到下依序升階；可以增減、改名、改格數。
#  最後一階蓋滿後會停住，之後在下面加入新階級，玩家就會在下一次重置時升階。
#  這個檔案只在不存在時產生，不會自動補齊。
#
#  display      顯示名稱
#  icon         選單圖示
#  cells        這一階要蓋幾個章才升階
#  task-reward  這一階任務的預設完成獎勵（任務自己有 reward 時以任務為主）
#  cell-rewards 蓋到第幾格時給的獎勵（可不設）；最後一格就是這一階的「底」
#
#  獎勵格式（可混搭，都可省略）：
#    money: 100            錢（Vault）
#    currency: 10          第二貨幣（config.yml 的 economy.second-currency）
#    tickets: 1            補簽卷
#    items:                物品
#      - 'diamond 2'       材質 數量
#      - item: 'minecraft:diamond_sword[enchantments={levels:{"minecraft:sharpness":5}}]'
#        amount: 1         帶 NBT／元件的物品；手拿物品輸入 /dq admin itemstring 可取得字串
#    commands:             以後台身分執行，%player% 會換成玩家名稱
#      - 'say %player% 好棒'
#    display:              自訂獎勵說明（不填會自動產生）
#      - '&f神秘禮物'
# ==========================================================

