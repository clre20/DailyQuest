# ==========================================================
#  DailyQuest 任務池
#  第一層是階級 ID（要和 tiers.yml 相同），第二層是任務 ID（同一階內不可重複）。
#  這個檔案只在不存在時產生，不會自動補齊，請放心修改。
#
#  type    任務類型（見 README），例如 BREAK_BLOCK、KILL_ENTITY、WALK
#  targets 目標（方塊／物品／生物）；不填＝任何目標都算。
#          可以用標籤，例如 '#minecraft:logs'
#  amount  需要的數量（距離類單位是格，PLAYTIME 單位是分鐘）
#  display 顯示名稱，%amount% 會換成數量
#  icon    選單圖示
#  weight  抽中的權重（預設 1）
#  reward  完成獎勵；不填就用 tiers.yml 裡該階的 task-reward
# ==========================================================

novice:
  stone:
    type: BREAK_BLOCK
    targets: ['#minecraft:base_stone_overworld']
    amount: 64
    display: '&f挖掘 %amount% 個石頭'
    icon: STONE
  logs:
    type: BREAK_BLOCK
    targets: ['#minecraft:logs']
    amount: 32
    display: '&f砍伐 %amount% 個原木'
    icon: OAK_LOG
  dirt:
    type: BREAK_BLOCK
    targets: ['DIRT', 'GRASS_BLOCK', 'SAND', 'GRAVEL']
    amount: 64
    display: '&f挖掘 %amount% 個泥土、沙或礫石'
    icon: DIRT
  coal:
    type: BREAK_BLOCK
    targets: ['#minecraft:coal_ores']
    amount: 16
    display: '&f挖掘 %amount% 個煤礦'
    icon: COAL_ORE
  place:
    type: PLACE_BLOCK
    amount: 64
    display: '&f放置 %amount% 個方塊'
    icon: BRICKS
  wheat:
    type: HARVEST
    targets: ['WHEAT']
    amount: 32
    display: '&f收成 %amount% 株成熟小麥'
    icon: WHEAT
  roots:
    type: HARVEST
    targets: ['POTATOES', 'CARROTS', 'BEETROOTS']
    amount: 32
    display: '&f收成 %amount% 株成熟馬鈴薯、胡蘿蔔或甜菜根'
    icon: CARROT
  zombie:
    type: KILL_ENTITY
    targets: ['ZOMBIE', 'HUSK', 'DROWNED', 'ZOMBIE_VILLAGER']
    amount: 10
    display: '&f擊殺 %amount% 隻殭屍'
    icon: ROTTEN_FLESH
  skeleton:
    type: KILL_ENTITY
    targets: ['SKELETON', 'STRAY', 'BOGGED']
    amount: 10
    display: '&f擊殺 %amount% 隻骷髏'
    icon: BONE
  spider:
    type: KILL_ENTITY
    targets: ['SPIDER', 'CAVE_SPIDER']
    amount: 8
    display: '&f擊殺 %amount% 隻蜘蛛'
    icon: STRING
  fish:
    type: FISH
    amount: 5
    display: '&f釣到 %amount% 次東西'
    icon: FISHING_ROD
  smelt:
    type: SMELT
    amount: 32
    display: '&f從熔爐取出 %amount% 個成品'
    icon: FURNACE
  craft:
    type: CRAFT
    amount: 32
    display: '&f合成 %amount% 個物品'
    icon: CRAFTING_TABLE
  breed:
    type: BREED
    amount: 4
    display: '&f繁殖 %amount% 次動物'
    icon: HAY_BLOCK
  shear:
    type: SHEAR
    targets: ['SHEEP']
    amount: 5
    display: '&f剪 %amount% 次羊毛'
    icon: SHEARS
  milk:
    type: MILK
    targets: ['COW', 'MOOSHROOM', 'GOAT']
    amount: 3
    display: '&f擠 %amount% 桶奶'
    icon: MILK_BUCKET
  eat:
    type: CONSUME
    amount: 10
    display: '&f吃或喝 %amount% 次'
    icon: COOKED_BEEF
  pickup:
    type: PICKUP
    amount: 64
    display: '&f撿起 %amount% 個物品'
    icon: HOPPER
  exp:
    type: GAIN_EXP
    amount: 100
    display: '&f獲得 %amount% 點經驗'
    icon: EXPERIENCE_BOTTLE
  jump:
    type: JUMP
    amount: 100
    display: '&f跳躍 %amount% 次'
    icon: RABBIT_FOOT
  sleep:
    type: SLEEP
    amount: 1
    display: '&f在床上睡著 %amount% 次'
    icon: RED_BED
  bow:
    type: SHOOT_BOW
    amount: 20
    display: '&f射出 %amount% 支箭'
    icon: BOW
  snowball:
    type: THROW
    targets: ['SNOWBALL', 'EGG']
    amount: 16
    display: '&f丟出 %amount% 顆雪球或雞蛋'
    icon: SNOWBALL
  walk:
    type: WALK
    amount: 500
    display: '&f行走 %amount% 格'
    icon: LEATHER_BOOTS
  sprint:
    type: SPRINT
    amount: 300
    display: '&f衝刺 %amount% 格'
    icon: IRON_BOOTS
  playtime:
    type: PLAYTIME
    amount: 30
    display: '&f在線 %amount% 分鐘'
    icon: CLOCK

